<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Pong</title><style>:root{--bg:#070b14;--text:#eaf2ff;--a:#55f6c2;--b:#ff5eea}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#172447,transparent 35%),radial-gradient(circle at 80% 90%,#25143a,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{width:min(1100px,96vw);padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{margin:0;font-size:clamp(22px,4vw,36px);letter-spacing:.08em;text-transform:uppercase}.tag{font-size:12px;opacity:.7;letter-spacing:.12em}.game{background:#0d1424e8;border:1px solid #263451;border-radius:18px;padding:12px;box-shadow:0 25px 80px #0008}canvas{display:block;width:100%;aspect-ratio:16/9;background:#050812;border-radius:12px;border:1px solid #1c2944;cursor:crosshair}.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 2px}.score{font-size:28px;font-weight:800}.score span:first-child{color:var(--a)}.score span:last-child{color:var(--b)}button{border:1px solid #405273;background:#121c31;color:var(--text);padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap}.help{text-align:center;font-size:13px;opacity:.7;padding:8px}kbd{background:#18243b;border:1px solid #33445f;border-radius:5px;padding:2px 6px}.overlay{position:relative}.status{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.message{background:#080d18dd;border:1px solid #415273;border-radius:14px;padding:16px 22px;text-align:center}.message b{display:block;font-size:25px;margin-bottom:5px}</style></head><body><main class="app"><header><div><h1>Neon Pong</h1><div class="tag">SINGLE-PAGE ARCADE</div></div><div class="tag">FIRST TO 7</div></header><section class="game"><div class="overlay"><canvas id="pong" width="960" height="540"></canvas><div class="status"><div class="message" id="message"><b>READY?</b>Press Space or click the game</div></div></div><div class="bar"><div class="score"><span id="playerScore">0</span><span> : </span><span id="cpuScore">0</span></div><div class="controls"><button id="start">Start / Pause</button><button id="reset">Reset</button><button id="sound">Sound: On</button></div></div><div class="help"><kbd>W</kbd>/<kbd>S</kbd> or <kbd>↑</kbd>/<kbd>↓</kbd> • Mouse/touch • <kbd>Space</kbd> pause</div></section></main><script>(()=>{const c=document.getElementById('pong'),x=c.getContext('2d'),ps=document.getElementById('playerScore'),cs=document.getElementById('cpuScore'),m=document.getElementById('message');let run=0,snd=1,p=0,q=0,last=0,k={};const P={x:34,y:220,w:13,h:100,s:470},C={x:913,y:220,w:13,h:100,s:390},B={x:480,y:270,r:9,vx:430,vy:230,s:430};let ac;function beep(f=440,d=.04){if(!snd)return;ac??=new(window.AudioContext||webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.035;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function ball(dir=Math.random()<.5?-1:1){B.x=480;B.y=270;B.s=430;let a=Math.random()*.9-.45;B.vx=dir*B.s*Math.cos(a);B.vy=B.s*Math.sin(a)}function reset(){p=q=0;ps.textContent=cs.textContent=0;P.y=C.y=220;ball();run=0;m.style.display='grid';m.innerHTML='<b>READY?</b>Press Space or click the game'}function toggle(){run=!run;m.style.display=run?'none':'grid';if(!run)m.innerHTML='<b>PAUSED</b>Press Space or click to resume';else beep(600,.06)}function hit(a){return B.x-B.r<a.x+a.w&&B.x+B.r>a.x&&B.y-B.r<a.y+a.h&&B.y+B.r>a.y}function point(w){w==='p'?p++:q++;ps.textContent=p;cs.textContent=q;beep(w==='p'?800:220,.1);if(p>=7||q>=7){run=0;m.style.display='grid';m.innerHTML='<b>'+(p>=7?'YOU WIN!':'CPU WINS!')+'</b>Final score '+p+' : '+q+'<br><small>Press Reset</small>'}else ball(w==='p'?-1:1)}function update(dt){let d=(k.ArrowUp||k.w)?-1:(k.ArrowDown||k.s)?1:0;P.y=clamp(P.y+d*P.s*dt,0,440);C.y+=clamp(B.y-C.h/2-C.y,-C.s*dt*.82,C.s*dt*.82);B.x+=B.vx*dt;B.y+=B.vy*dt;if(B.y-B.r<0||B.y+B.r>540){B.vy*=-1;B.y=clamp(B.y,B.r,531);beep(320)}if(hit(P)&&B.vx<0){B.x=48+B.r;let a=((B.y-P.y-50)/50)*.95;B.s=Math.min(B.s*1.055,850);B.vx=B.s*Math.cos(a);B.vy=B.s*Math.sin(a);beep(520)}if(hit(C)&&B.vx>0){B.x=913-B.r;let a=Math.PI-((B.y-C.y-50)/50)*.95;B.s=Math.min(B.s*1.055,850);B.vx=B.s*Math.cos(a);B.vy=B.s*Math.sin(a);beep(520)}if(B.x<-30)point('q');if(B.x>990)point('p')}function draw(){x.fillStyle='#050812';x.fillRect(0,0,960,540);x.setLineDash([10,14]);x.strokeStyle='#24304a';x.lineWidth=3;x.beginPath();x.moveTo(480,15);x.lineTo(480,525);x.stroke();x.setLineDash([]);x.shadowBlur=22;x.shadowColor='#55f6c2';x.fillStyle='#55f6c2';x.fillRect(P.x,P.y,P.w,P.h);x.shadowColor='#ff5eea';x.fillStyle='#ff5eea';x.fillRect(C.x,C.y,C.w,C.h);x.shadowColor='#fff';x.fillStyle='#fff';x.beginPath();x.arc(B.x,B.y,B.r,0,7);x.fill();x.shadowBlur=0}function loop(t){let dt=Math.min((t-last)/1e3,.025);last=t;if(run)update(dt);draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{k[e.key]=1;if(e.key===' ')toggle()});addEventListener('keyup',e=>k[e.key]=0);c.onpointermove=e=>{let r=c.getBoundingClientRect();P.y=clamp((e.clientY-r.top)/r.height*540-50,0,440)};c.onpointerdown=()=>!run&&toggle();document.getElementById('start').onclick=toggle;document.getElementById('reset').onclick=reset;document.getElementById('sound').onclick=e=>{snd=!snd;e.currentTarget.textContent='Sound: '+(snd?'On':'Off');if(snd)beep()};reset();requestAnimationFrame(loop)})();</script></body></html>
