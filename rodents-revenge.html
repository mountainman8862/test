<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rodent's Revenge — Neon Arcade</title><style>body{margin:0;background:#080b12;color:#eee;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:20px}.bar{display:flex;justify-content:space-between;align-items:center}button{padding:9px 14px;background:#18233a;color:#fff;border:1px solid #405273;border-radius:8px}canvas{width:100%;background:#111827;border:1px solid #33415f;border-radius:12px;image-rendering:pixelated}.help{opacity:.7;font-size:13px}</style><main><div class=bar><h1>🐭 Rodent's Revenge</h1><button onclick="location.href='index.html'">⌂ Arcade</button></div><canvas id=c width=720 height=560></canvas><p class=help>Arrow keys / WASD to move • Push blocks into cats • Collect cheese • R to restart</p></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=18,S=31,off=2;let player,cats,cheese,blocks,score,over;const key={};onkeydown=e=>{key[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')reset()};onkeyup=e=>key[e.key.toLowerCase()]=0;function cellFree(a,b){return a>=0&&a<N&&b>=0&&b<N}function reset(){player={x:9,y:15};score=0;over=0;cheese=[];blocks=[];cats=[];for(let i=0;i<32;i++){let p;do p={x:Math.random()*N|0,y:Math.random()*N|0};while((p.x===9&&p.y===15)||blocks.some(z=>z.x===p.x&&z.y===p.y));blocks.push(p)}for(let i=0;i<4;i++){let p;do p={x:Math.random()*N|0,y:Math.random()*N|0};while((p.x===9&&p.y===15)||blocks.some(z=>z.x===p.x&&z.y===p.y));cats.push(p)}for(let i=0;i<10;i++){let p;do p={x:Math.random()*N|0,y:Math.random()*N|0};while((p.x===9&&p.y===15)||blocks.some(z=>z.x===p.x&&z.y===p.y)||cats.some(z=>z.x===p.x&&z.y===p.y));cheese.push(p)}}function blocked(px,py){return blocks.find(b=>b.x===px&&b.y===py)}function move(dx,dy){if(over)return;let nx=player.x+dx,ny=player.y+dy;if(!cellFree(nx,ny))return;let b=blocked(nx,ny);if(b){let bx=nx+dx,by=ny+dy;if(!cellFree(bx,by)||blocked(bx,by)||cats.some(q=>q.x===bx&&q.y===by))return;b.x=bx;b.y=by}if(cats.some(q=>q.x===nx&&q.y===ny)){over=1;return}player.x=nx;player.y=ny;let i=cheese.findIndex(q=>q.x===nx&&q.y===ny);if(i>=0){cheese.splice(i,1);score++;if(!cheese.length)over=2}}let timer=0,lastMove='';function update(dt){timer+=dt;let dx=0,dy=0;if((key.arrowup||key.w)&&lastMove!=='u')dy=-1;else if((key.arrowdown||key.s)&&lastMove!=='d')dy=1;else if((key.arrowleft||key.a)&&lastMove!=='l')dx=-1;else if((key.arrowright||key.d)&&lastMove!=='r')dx=1;if(dx||dy){move(dx,dy);lastMove=dy<0?'u':dy>0?'d':dx<0?'l':'r';timer=0}else if(timer>.12)lastMove=''}function draw(){x.fillStyle='#111827';x.fillRect(0,0,720,560);for(let y=0;y<N;y++)for(let z=0;z<N;z++){x.strokeStyle='#1c2940';x.strokeRect(z*S+off,y*S+off,S-2,S-2)}cheese.forEach(q=>{x.fillStyle='#ffd84d';x.fillRect(q.x*S+9,q.y*S+10,13,10)});blocks.forEach(b=>{x.fillStyle='#6b7280';x.fillRect(b.x*S+3,b.y*S+3,25,25);x.fillStyle='#9ca3af';x.fillRect(b.x*S+8,b.y*S+8,15,15)});cats.forEach(q=>{x.fillStyle='#ff5eea';x.beginPath();x.arc(q.x*S+15,q.y*S+17,11,0,7);x.fill();x.fillStyle='#111';x.fillRect(q.x*S+9,q.y*S+12,4,4);x.fillRect(q.x*S+18,q.y*S+12,4,4)});x.fillStyle='#55f6c2';x.beginPath();x.arc(player.x*S+15,player.y*S+16,11,0,7);x.fill();x.fillStyle='#111';x.fillRect(player.x*S+8,player.y*S+11,4,4);x.fillRect(player.x*S+18,player.y*S+11,4,4);x.fillStyle='#fff';x.font='bold 18px system-ui';x.fillText('CHEESE: '+score,12,550);if(over){x.fillStyle='#000b';x.fillRect(0,0,720,560);x.fillStyle='#fff';x.textAlign='center';x.font='bold 34px system-ui';x.fillText(over===2?'ALL CHEESE COLLECTED!':'THE CAT GOT YOU!',360,270);x.font='16px system-ui';x.fillText('Press R to play again',360,305);x.textAlign='left'}}function loop(t){let dt=Math.min((t-(loop.last||t))/1000,.1);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)</script></html>
